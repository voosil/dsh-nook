# Nook product Bundle. Providers and features are separate rows so runtime
# injection, replacement, and diagnostics stay explicit.
- id: client-hmr
  # Usage serves a fixed build. The development launcher enables the verified
  # official Client HMR chain through its own overlay.
  disabled: true

- insert:
    - id: nook-dsh-compat
      name: '@nook-dsh/dsh-compat'

    - id: nook-artifact-provider
      name: '@nook-dsh/provider-artifact-local'
      config:
        root: !!js dshHomePath('nook/artifacts')
        maxBytes: 20000000

    - id: nook-project-feature
      name: '@nook-dsh/feature-project'

    - id: nook-preview-feature
      name: '@nook-dsh/feature-preview'

    - id: nook-dsh-adapter
      name: '@nook-dsh/dsh-adapter'

    - id: nook-agent-feature
      name: '@nook-dsh/feature-agent'

    - id: nook-ui-project
      name: '@nook-dsh/ui-project'

    - id: nook-ui-sidebar
      name: '@nook-dsh/ui-sidebar'

- insert:
    - id: nook-notebook-provider
      name: '@nook-dsh/provider-notebook-local'
      config:
        file: !!js dshHomePath('nook/notebook.sqlite')
        projectsFile: !!js dshHomePath('nook/projects.json')
    - id: nook-sync-storage
      name: '@nook-dsh/adapter-sync-webdav'
    - id: nook-sync-feature
      name: '@nook-dsh/feature-sync'
      config:
        file: !!js dshHomePath('nook-sync/settings.json')
    - id: nook-sync-rpc
      name: '@nook-dsh/adapter-sync-dsh'
    - id: nook-notes-feature
      name: '@nook-dsh/feature-notes'
    - id: nook-notes-rpc
      name: '@nook-dsh/adapter-notes-dsh'
    - id: nook-ui-notes
      name: '@nook-dsh/ui-notes'

- insert:
    - id: nook-intelligence-adapter
      name: '@nook-dsh/adapter-intelligence-dsh'
    - id: nook-reflection-feature
      name: '@nook-dsh/feature-reflection'

- insert:
    - id: nook-video-source
      name: '@nook-dsh/adapter-video-platform'
      config:
        root: !!js dshHomePath('nook/videos')
        python: python3
    - id: nook-video-editor
      name: '@nook-dsh/provider-video-editor'
      config:
        cache: !!js dshHomePath('nook/video-editor-cache')
    - id: nook-video-feature
      name: '@nook-dsh/feature-video'

- insert:
    - id: nook-knowledge-adapter
      name: '@nook-dsh/adapter-knowledge-dsh'
    - id: nook-ui-knowledge
      name: '@nook-dsh/ui-knowledge'

- insert:
    - id: nook-update-provider
      name: '@nook-dsh/provider-update-local'
    - id: nook-update-rpc
      name: '@nook-dsh/adapter-update-dsh'
